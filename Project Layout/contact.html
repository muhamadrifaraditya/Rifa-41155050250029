  <main>
    <h2>Kirim Pesan</h2>
    <p>Jika ada pertanyaan atau ingin berdiskusi, silakan isi formulir di bawah ini:</p>
    <form style="margin-top: 1.5rem; max-width: 600px;">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda..." required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Masukkan email Anda..." required>
      </div>
      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" rows="5" placeholder="Tuliskan pesan Anda..." required></textarea>
      </div>
      <button type="submit" class="btn" style="border: none; cursor: pointer;">Kirim Pesan</button>
    </form>
  </main>
