<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<center>
    <h1>Novell Services Login</h1>
    <table>
        <tr>
            <td>Username: </td>
            <td><input type="text" name="username"></td>
        </tr>
        <tr>
            <td>Password: </td>
            <td><input type="password" name="password"></td>
        </tr>
        <tr>
            <td>Employment: </td>
            <td><input type="text" name="employment"></td>
        </tr>
        <tr>
            <td>Web Server: </td>
            <td>
                <select value="Choose a server">Choose a server
                <option value="live server">Choose a server</option>
            </select></td>
        </tr>
        <tr>
            <td rowspan="4">Please Specify your role:</td>
            <td><input type="radio">Admin</td>
        </tr>
        <tr>
            <td><input type="radio">Engineer</td>
        </tr>
        <tr>
            <td><input type="radio">Manager</td>
        </tr>
        <tr>
            <td><input type="radio">Guest</td>
        </tr>
        <tr>
            <td rowspan="3">Single Sign-on to the following:</td>
            <td><input type="checkbox">Mail</td>
        </tr>
        <tr>
            <td><input type="checkbox">Payroll</td>
        </tr>
        <tr>
            <td><input type="checkbox">Self-services</td>
        </tr>
    </table>
    <p align="center">
        <input type="submit" value="login">
        <input type="submit" value="Reset">
    </p>
    </center>
</body>
</html>
