<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Muhamad Rifa Raditya</title>
    <style>
        body {
            background-color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }


        .card {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #34495e;
            font-size: 1.1rem;
            margin-top: 25px;
            margin-bottom: 12px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        form label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        form input[type="text"],
        form input[type="number"],
        form textarea,
        table input[type="text"],
        table input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        form textarea {
            resize: vertical;
        }

        table.styled-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        table.styled-table td, table.styled-table th {
            border: 1px solid #dfe6e9;
            padding: 8px 12px;
            text-align: center;
        }

        table.form-table {
            width: 100%;
            margin-top: 10px;
        }

        table.form-table td {
            padding: 6px 0;
            border: none;
        }

        .submit-btn, input[type="submit"] {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover, input[type="submit"]:hover {
            background-color: #27ae60;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Halaman Contact</h1>
        <p class="subtitle">Hubungi kami melalui form atau lihat tabel data</p>

        <div class="nav-buttons">
            <a href="index.html" class="btn">Home</a>
            <a href="about.html" class="btn">About</a>
        </div>

        <h2>Form Kontak</h2>
        <form action="#" method="POST">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required>

            <label for="alamat">Alamat:</label>
            <textarea id="alamat" name="alamat" rows="3" required></textarea>

            <label for="umur">Umur:</label>
            <input type="number" id="umur" name="umur" min="1" required>

            <button type="submit" class="submit-btn">Kirim</button>
        </form>

        <h2>Tabel Data Angka</h2>
        <table class="styled-table">
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>

        <h2>Tabel Form Login</h2>
        <table class="form-table">
            <tr>
                <td style="width: 30%;">Username</td>
                <td><input type="text" name="username"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="password"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="LOGIN"></td>
            </tr>
        </table>

        <footer>
            &copy; 2026 Muhamad Rifa Raditya. All rights reserved.
        </footer>
    </div>

</body>
</html>
